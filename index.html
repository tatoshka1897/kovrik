<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Коврик — запись</title>
<link rel="stylesheet" href="fonts.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --red: #A81F27; --ink: #2B1D1B; --soft: #6F5A4E; --paper: #F5E8D2; --card: #FBF3E6; --line: rgba(168,31,39,.35); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: 'Golos Text', system-ui, sans-serif; font-size: 16px; line-height: 1.4; padding: 18px 16px 40px; max-width: 560px; margin: 0 auto; }
  .r2 { height: 7px; border-top: 3px solid var(--red); border-bottom: 1px solid var(--red); }
  .r1 { border-top: 1px solid var(--line); margin: 14px 0; }
  header { text-align: center; }
  .sc { font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--red); font-size: 11px; }
  .wm { font-family: 'Yeseva One', serif; color: var(--red); font-size: 54px; line-height: 1; margin: 8px 0 2px; }
  .ci { font-family: 'Cormorant Infant', serif; font-style: italic; font-weight: 600; }
  header .ci { font-size: 20px; color: var(--soft); }
  header img { width: 78%; max-width: 340px; display: block; margin: 12px auto 4px; }
  h2 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 26px; text-align: center; margin: 4px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; display: flex; gap: 14px; }
  .date { min-width: 64px; text-align: center; }
  .date .n { font-family: 'Yeseva One', serif; color: var(--red); font-size: 44px; line-height: 1; }
  .date .m { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin-top: 4px; }
  .date .w { font-size: 12px; color: var(--soft); }
  .body { flex: 1; min-width: 0; }
  .title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px; line-height: 1.2; }
  .time { font-weight: 600; margin: 2px 0 6px; }
  .descr { font-family: 'Cormorant Infant', serif; font-size: 17px; line-height: 1.3; color: var(--ink); }
  .seats { font-size: 13px; color: var(--soft); margin: 8px 0; }
  .status { font-size: 14px; font-weight: 600; color: var(--red); margin-top: 8px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 600 15px 'Golos Text', system-ui, sans-serif; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
  .b1 { background: var(--red); color: #FBF3E6; }
  .b2 { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
  .more { display: grid; gap: 8px; margin-top: 6px; }
  .more button { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  .info { text-align: center; font-size: 14px; color: var(--soft); margin-top: 14px; line-height: 1.6; }
  .info a { color: var(--red); }
  .empty, .err { text-align: center; padding: 26px 8px; color: var(--soft); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(43,29,27,.45); display: none; align-items: flex-end; z-index: 10; }
  .sheet { background: var(--paper); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 21px; }
  .sheet .when { color: var(--soft); margin: 2px 0 12px; }
  .sheet label { display: block; font-size: 13px; color: var(--soft); margin: 10px 0 4px; }
  .sheet input { width: 100%; font: 17px 'Golos Text', system-ui, sans-serif; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
  .seg button.on { border-color: var(--red); background: var(--red); color: #FBF3E6; }
  .note { font-size: 12px; color: var(--soft); margin: 10px 0 14px; }
  .sheet .go { width: 100%; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 24px; background: var(--ink); color: #FBF3E6; padding: 12px 14px; border-radius: 12px; text-align: center; display: none; z-index: 20; }
</style>
</head>
<body>
<div class="r2"></div>
<header>
  <div class="sc" style="margin-top:12px">творческое пространство</div>
  <div class="wm">Коврик</div>
  <div class="ci">коллажи, чай и разговоры</div>
  <img src="emblema.png" alt="">
</header>
<div class="r1"></div>
<h2>Ближайшие посиделки</h2>
<div id="list"><div class="empty">Загружаю встречи…</div></div>
<div id="more"></div>
<div class="info" id="info"></div>
<div class="r1"></div>
<div class="r2" style="transform:scaleY(-1)"></div>

<div class="sheet-bg" id="bg">
  <div class="sheet">
    <h3 id="s-title"></h3>
    <div class="when" id="s-when"></div>
    <label for="s-name">Как вас зовут?</label>
    <input id="s-name" maxlength="60" autocomplete="given-name" placeholder="Имя">
    <div id="s-seg-wrap">
      <label>Сколько мест?</label>
      <div class="seg"><button id="s1" class="on" type="button">1 место</button><button id="s2" type="button">Вдвоём</button></div>
    </div>
    <div class="note">Заявку подтверждает организатор — ответ придёт в чат с ботом. Ваше имя увидит только организатор.</div>
    <div class="btns"><button class="b1 go" id="s-go" type="button">Отправить заявку</button></div>
    <div class="btns" style="margin-top:8px"><button class="b2 go" id="s-x" type="button">Отмена</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://kovrik-bot.kovrik.workers.dev";
const tg = window.Telegram && window.Telegram.WebApp;
const init = tg && tg.initData ? tg.initData : "";
const test = /[?&]test/.test(location.search);
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#F5E8D2"); tg.setBackgroundColor("#F5E8D2"); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
let data = null, cur = null, seats = 1;

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3200); }
function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function openBot(start) { const u = `https://t.me/${data ? data.bot : "kovrik_zapis_bot"}?start=${start}`; if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else location.href = u; }

async function load() {
  try {
    const r = await fetch(API + "/api/meetings" + (init ? "?init=" + encodeURIComponent(init) : ""), { cache: "no-store" });
    data = await r.json();
    render();
  } catch (e) {
    $("list").innerHTML = '<div class="err">Не получилось загрузить встречи. Проверьте интернет.<br><br><button class="b2" onclick="load()">Обновить</button></div>';
  }
}

function render() {
  const ms = data.meetings || [];
  $("list").innerHTML = ms.length ? "" : '<div class="empty">Сейчас открытых встреч нет — анонсы новых появятся в канале 🌸</div>';
  for (const m of ms) {
    const el = document.createElement("div"); el.className = "card";
    let seatsTxt = m.free ? `свободно ${m.free} из ${m.seats}` : m.extra ? "основные места заняты — можно попросить дополнительное" : "мест нет — можно встать в лист ожидания";
    let action = "";
    if (m.mine === "active") action = '<div class="status">✅ Вы записаны</div>';
    else if (m.mine === "pending") action = '<div class="status">⏳ Заявка отправлена — ответ придёт в чат</div>';
    else if (m.mine === "wait") action = '<div class="status">🕐 Вы в листе ожидания</div>';
    else if (m.late) action = (m.free || m.extra) ? `<div class="btns"><button class="b1" data-b="${m.id}:1">Попросить место</button></div>` : '<div class="status">🔒 Запись закрыта</div>';
    else if (m.free) action = `<div class="btns"><button class="b1" data-b="${m.id}:1">Записаться ♥</button>${data.pairs && m.free + m.extra >= 2 ? `<button class="b2" data-b="${m.id}:2">Вдвоём</button>` : ""}</div>`;
    else if (m.extra) action = `<div class="btns"><button class="b1" data-b="${m.id}:1">Попросить доп. место</button></div>`;
    else action = `<div class="btns"><button class="b2" data-b="${m.id}:1">Встать в лист ожидания</button></div>`;
    el.innerHTML = `<div class="date"><div class="n">${m.day}</div><div class="m">${esc(m.mon)}</div><div class="w">${esc(m.wd)}</div></div>
      <div class="body"><div class="title">${esc(m.title)}</div><div class="time">${esc(m.time)}</div>
      ${m.descr ? `<div class="descr">${esc(m.descr)}</div>` : ""}<div class="seats">${esc(seatsTxt)}</div>${action}</div>`;
    $("list").appendChild(el);
  }
  $("list").querySelectorAll("[data-b]").forEach(b => b.onclick = () => { const [id, n] = b.dataset.b.split(":"); openSheet(+id, +n); });
  $("more").innerHTML = (data.menu || test) ? `<div class="r1"></div><h2 style="font-size:21px">Ещё в «Коврике»</h2><div class="more">
    <button onclick="openBot('company')">👯 Своя компания — встреча только для вас</button>
    <button onclick="openBot('rent')">🏠 Аренда пространства по часам</button>
    <button onclick="openBot('collab')">🤝 Сотрудничество / свой мастер-класс</button></div>` : "";
  $("info").innerHTML = `📍 ${esc(data.place)} · <a href="${esc(data.map)}" target="_blank">карта</a><br>💌 ${esc(data.donation)}`;
}

function openSheet(id, n) {
  if (!init) { toast("Откройте окошко из бота @kovrik_zapis_bot в Telegram"); return; }
  cur = data.meetings.find(m => m.id === id); if (!cur) return;
  setSeats(n);
  $("s-title").textContent = cur.title;
  $("s-when").textContent = `${cur.wd}, ${cur.day} ${cur.mon}, ${cur.time}`;
  $("s-name").value = $("s-name").value || data.name || "";
  $("s-seg-wrap").style.display = data.pairs && cur.free + cur.extra >= 2 ? "" : "none";
  $("bg").style.display = "flex";
}
function setSeats(n) { seats = n; $("s1").classList.toggle("on", n === 1); $("s2").classList.toggle("on", n === 2); }
$("s1").onclick = () => setSeats(1); $("s2").onclick = () => setSeats(2);
$("s-x").onclick = () => { $("bg").style.display = "none"; };
$("bg").onclick = e => { if (e.target === $("bg")) $("bg").style.display = "none"; };
$("s-go").onclick = async () => {
  const name = $("s-name").value.trim();
  if (!name) { toast("Напишите, пожалуйста, имя"); $("s-name").focus(); return; }
  const btn = $("s-go"); btn.disabled = true; btn.textContent = "Отправляю…";
  try {
    const r = await fetch(API + "/api/book", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ init, mid: cur.id, n: seats, name }) });
    const j = await r.json();
    if (j.ok) {
      haptic("success"); $("bg").style.display = "none";
      toast(j.status === "wait" ? "Вы в листе ожидания — освободится место, бот напишет 🌸" : j.status === "already" ? "Вы уже записаны на эту встречу" : "Заявка отправлена 🌸 Ответ придёт в чат с ботом");
      await load();
    } else { haptic("error"); toast(j.error || "Не получилось, попробуйте ещё раз"); }
  } catch (e) { haptic("error"); toast("Нет связи — попробуйте ещё раз"); }
  btn.disabled = false; btn.textContent = "Отправить заявку";
};
load();
</script>
</body>
</html>
